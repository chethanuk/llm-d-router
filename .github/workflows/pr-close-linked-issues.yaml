# Closes the `Fixes #N` issues of PRs merged through the merge queue. Those PRs are
# merged by the llm-d-router-release-notes App, and GitHub does not close their
# linked issues the way it does for maintainer merges (#3703).

name: Close Linked Issues

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    name: Close issues linked from a merge-queue merge
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.merged_by.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/pr-close-linked-issues.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const { closeLinkedIssues } = require('./.github/scripts/pr-close-linked-issues.cjs');
            await closeLinkedIssues({ github, context });
